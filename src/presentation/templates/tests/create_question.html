{% extends "base/base.html" %}
{% block title %}Конструктор вопроса{% endblock %}
{% block header_title %}Банк тестов{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-10 col-lg-8 mx-auto">
        <div class="card card-custom p-4 shadow-sm border-0">
            <h4 class="fw-bold text-primary mb-4">Добавление вопроса</h4>

            <form id="questionForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Текст вопроса (поддерживает Markdown/Код)</label>
                    <textarea class="form-control" id="qText" rows="3" placeholder="Например: Что выведет этот код?" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-secondary">Прикрепить медиафайл (необязательно)</label>
                    <input type="file" class="form-control" id="qMedia" accept="image/*,video/*,audio/*">
                    <div class="form-text small">Поддерживаются картинки, аудио и видеофайлы.</div>
                </div>

                <div class="row mb-4 p-3 bg-light rounded border">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Тип вопроса</label>
                        <select class="form-select" id="qType">
                            <option value="single_choice">Один правильный ответ</option>
                            <option value="multiple_choice">Несколько правильных ответов</option>
                        </select>
                    </div>
                    <div class="col-md-6 d-flex align-items-center mt-4 mt-md-0">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="qPartial" checked>
                            <label class="form-check-label fw-bold" for="qPartial">
                                Разрешить частичные баллы
                                <i class="bi bi-info-circle text-muted" title="Например: 4 из 5 правильных дадут 0.8 балла"></i>
                            </label>
                        </div>
                    </div>
                </div>

                <h5 class="fw-bold mb-3 border-bottom pb-2">Варианты ответов</h5>
                <div id="optionsContainer">
                </div>

                <button type="button" class="btn btn-outline-primary btn-sm mb-4 fw-bold" onclick="addOption()">
                    + Добавить вариант ответа
                </button>

                <hr>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2" id="submitBtn">Сохранить вопрос</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
    const optionsContainer = document.getElementById('optionsContainer');
    let optionCount = 0;

    function addOption() {
        optionCount++;
        const div = document.createElement('div');
        div.className = 'row mb-2 align-items-center option-row';
        div.innerHTML = `
            <div class="col-md-7">
                <input type="text" class="form-control opt-text" placeholder="Текст ответа" required>
            </div>
            <div class="col-md-2 text-center">
                <div class="form-check form-switch d-flex justify-content-center">
                    <input class="form-check-input opt-correct" type="checkbox" title="Правильный ответ?">
                </div>
            </div>
            <div class="col-md-2">
                <input type="number" class="form-control opt-weight" step="0.1" value="1.0" min="0" title="Вес балла">
            </div>
            <div class="col-md-1 text-end">
                <button type="button" class="btn btn-sm btn-outline-danger border-0" onclick="this.closest('.option-row').remove()">✖</button>
            </div>
        `;
        optionsContainer.appendChild(div);
    }

    addOption();
    addOption();

    document.getElementById('questionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Сохранение...';

        const options = Array.from(document.querySelectorAll('.option-row')).map(row => ({
            text: row.querySelector('.opt-text').value,
            is_correct: row.querySelector('.opt-correct').checked,
            score_weight: parseFloat(row.querySelector('.opt-weight').value)
        }));

        // Собираем JSON с данными вопроса
        const payload = {
            text: document.getElementById('qText').value,
            type: document.getElementById('qType').value,
            allow_partial_credit: document.getElementById('qPartial').checked,
            options: options
        };

        // Создаем FormData для отправки JSON и Файла вместе
        const formData = new FormData();
        // Упаковываем JSON в строку!
        formData.append('question_data', JSON.stringify(payload));

        // Прикрепляем файл, если он выбран
        const fileInput = document.getElementById('qMedia');
        if (fileInput.files.length > 0) {
            formData.append('file', fileInput.files[0]);
        }

        try {
            const response = await fetch(`/tests/{{ test_id }}/questions/create`, {
                method: 'POST',
                // Content-Type не указываем, браузер сам установит multipart/form-data с нужным boundary
                body: formData
            });

            if (response.ok) {
                alert("Вопрос успешно добавлен!");
                window.location.reload();
            } else {
                const errorData = await response.json();
                alert("Ошибка при сохранении: " + (errorData.detail || errorData.error || "Неизвестная ошибка"));
            }
        } catch (err) {
            console.error(err);
            alert("Произошла ошибка при отправке.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Сохранить вопрос';
        }
    });
</script>
{% endblock %}
